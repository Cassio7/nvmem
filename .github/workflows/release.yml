name: Release

# Push a tag like `v0.1.0` to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance attestations (Sigstore)
      attestations: write # store the attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    # Expressions go through env, never straight into `run:` scripts.
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          name="nvmtree-$TARGET$EXT"
          cp "target/$TARGET/release/nvmtree$EXT" "$name"
          # sha256sum format ("<hex>  <file>"), checked by the install scripts.
          # Written by hand: sha256sum on Windows may print "*<file>".
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "$name" | cut -d' ' -f1)
          else
            hash=$(shasum -a 256 "$name" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$hash" "$name" > "$name.sha256"
          cat "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The annotated tag's message becomes the release notes; tags without
        # one fall back to GitHub's generated notes. `|| true`: the parallel
        # build jobs race to create the release, and only one can win.
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" || true
            else
              gh release create "$TAG" --generate-notes || true
            fi
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # Install the just-published release with the real install scripts.
  verify-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NVMTREE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.local/bin/nvmtree" --version | grep -qx "nvmtree ${GITHUB_REF_NAME#v}"
          "$HOME/.local/bin/nvmtree" --help >/dev/null
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $v = nvmtree --version
          if ($v -ne "nvmtree $($env:GITHUB_REF_NAME.TrimStart('v'))") { throw "unexpected version: $v" }
          nvmtree --help | Out-Null
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:NVMTREE_INSTALL_DIR = "$env:RUNNER_TEMP\nvmtree-ps5"
          ./install.ps1
          & "$env:NVMTREE_INSTALL_DIR\nvmtree.exe" --version
