name: Release

# Push a tag like `v0.1.0` to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=nvmem-${{ matrix.target }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/nvmem${{ matrix.ext }} "$name"
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The annotated tag's message becomes the release notes; tags without
        # one fall back to GitHub's generated notes. `|| true`: the parallel
        # build jobs race to create the release, and only one can win.
        run: |
          tag=${{ github.ref_name }}
          if ! gh release view "$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            git tag -l --format='%(contents)' "$tag" > "$RUNNER_TEMP/notes.md"
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" || true
            else
              gh release create "$tag" --generate-notes || true
            fi
          fi
          gh release upload "$tag" "$ASSET" --clobber

  # Install the just-published release with the real install scripts.
  verify-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NVMEM_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.local/bin/nvmem" --version | grep -qx "nvmem ${GITHUB_REF_NAME#v}"
          "$HOME/.local/bin/nvmem" --help >/dev/null
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $v = nvmem --version
          if ($v -ne "nvmem $($env:GITHUB_REF_NAME.TrimStart('v'))") { throw "unexpected version: $v" }
          nvmem --help | Out-Null
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:NVMEM_INSTALL_DIR = "$env:RUNNER_TEMP\nvmem-ps5"
          ./install.ps1
          & "$env:NVMEM_INSTALL_DIR\nvmem.exe" --version
