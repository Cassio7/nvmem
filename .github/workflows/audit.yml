name: Security audit

# Checks every crate in Cargo.lock against the RustSec advisory database.
# Runs weekly (advisories appear even when our code doesn't change) and
# whenever dependencies change.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
