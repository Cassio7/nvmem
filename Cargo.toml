[package]
name = "nvmem"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
