[package]
name = "nvmtree"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "List your nvm Node.js versions and their global npm packages, compare them, and see what npx cached"
repository = "https://github.com/Cassio7/nvmtree"
readme = "README.md"
keywords = ["nvm", "nodejs", "npm", "cli", "global-packages"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
